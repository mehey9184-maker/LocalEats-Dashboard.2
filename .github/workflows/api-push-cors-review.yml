name: API FCM PUT CORS regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'localeats-api/src/server.ts'
      - 'localeats-api/src/corsPreflight.test.ts'
      - '.github/workflows/api-push-cors-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fcm-browser-registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localeats-api/package-lock.json
      - name: Install locked API dependencies
        run: npm ci --prefix localeats-api --no-audit --no-fund
      - name: Compile API
        run: npm run build --prefix localeats-api
      - name: Test real HTTP preflight and unauthorized writes
        env:
          PICKUP_WRITES_ENABLED: 'false'
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          FIREBASE_CLIENT_EMAIL: ''
          FIREBASE_PRIVATE_KEY: ''
        run: node --test localeats-api/dist/corsPreflight.test.js localeats-api/dist/corsOrigins.test.js
