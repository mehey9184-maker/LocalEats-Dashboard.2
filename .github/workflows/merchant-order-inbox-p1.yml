name: Merchant Phase 1 Order Inbox Recovery Preview Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/services/merchantOrderRecovery.ts'
      - 'tests/merchant-order-inbox-p1.test.mjs'
      - '.github/workflows/merchant-order-inbox-p1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merchant-order-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Shop-scoped order recovery, crashes, caching, pickup and rider lock
        run: node --experimental-strip-types --test tests/merchant-order-inbox-p1.test.mjs tests/merchant-cache-safety-main.test.mjs tests/merchant-crash-cache-main.test.mjs tests/merchant-riders-coming-soon-main.test.mjs tests/merchant-pickup.test.mjs
      - name: Merchant availability authority
        run: node --test tests/merchant-availability.test.cjs
      - name: Full Merchant build
        run: npm run build
