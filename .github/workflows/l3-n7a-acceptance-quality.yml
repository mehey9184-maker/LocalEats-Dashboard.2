name: L3-N7A Acceptance Typed Boundaries and Disposable Restore
on:
  pull_request:
    branches:
      - feature/pickup-acceptance-deadline
    paths:
      - 'localeats-api/src/orders/acceptance*'
      - 'localeats-api/src/routes/acceptance*'
      - 'localeats-api/tests/pickup/ci-l3-n7a-acceptance-restore.sh'
      - '.github/workflows/l3-n7a-acceptance-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typed-acceptance-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PICKUP_WRITES_ENABLED: 'false'
      PICKUP_ACCEPTANCE_ENABLED: 'false'
      PICKUP_ACCEPTANCE_WORKER_ENABLED: 'false'
      PICKUP_ACCEPTANCE_PUSH_ENABLED: 'false'
      VITE_PICKUP_ORDERING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install API and Merchant dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix localeats-api
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint all new acceptance API boundaries and security tests with existing rules
        run: |
          ./node_modules/.bin/eslint localeats-api/src/orders/acceptance.ts localeats-api/src/orders/acceptancePush.ts localeats-api/src/orders/acceptance.test.ts localeats-api/src/orders/acceptanceCycle.test.ts localeats-api/src/orders/acceptancePolicy.test.ts localeats-api/src/orders/acceptancePush.test.ts localeats-api/src/routes/acceptance.ts localeats-api/src/routes/acceptance.test.ts
          echo 'L3_N7A_ACCEPTANCE_SCOPE_ESLINT_PASS'
      - name: Compile and run authoritative API and acceptance regressions
        run: |
          npm test --prefix localeats-api
          npm run test:acceptance --prefix localeats-api
      - name: Build the shipped Merchant with ordering disabled
        run: npm run build
      - name: Confirm no hosted secret or write activation used
        run: |
          test "$PICKUP_WRITES_ENABLED" = 'false'
          test "$PICKUP_ACCEPTANCE_ENABLED" = 'false'
          test "$PICKUP_ACCEPTANCE_PUSH_ENABLED" = 'false'
          test -z "${DATABASE_URL:-}${SUPABASE_URL:-}${SUPABASE_SERVICE_ROLE_KEY:-}${SUPABASE_SECRET_KEY:-}"
          echo 'L3_N7A_RELEASE_FLAGS_REMAIN_OFF'

  acceptance-backup-disposable-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-n7a-discard
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: local_acceptance_qa
      PGUSER: postgres
      PGPASSWORD: synthetic-n7a-discard
      PGSSLMODE: disable
      PICKUP_TEST_ISOLATED: '1'
      PICKUP_WRITES_ENABLED: 'false'
      PICKUP_ACCEPTANCE_WORKER_ENABLED: 'false'
      PICKUP_ACCEPTANCE_PUSH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Refuse hosted database or pre-existing fixture
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}${SUPABASE_URL:-}${SUPABASE_SERVICE_ROLE_KEY:-}${SUPABASE_SECRET_KEY:-}"
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'local_acceptance_qa'
          test "$PICKUP_TEST_ISOLATED" = '1'
          test "$(PGDATABASE=postgres psql -X -At -v ON_ERROR_STOP=1 -c "select count(*) from pg_database where datname='local_acceptance_qa'")" = 0
          PGDATABASE=postgres createdb local_acceptance_qa
      - name: Apply reviewed pickup foundation and acceptance SQL ONLY to fresh disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for file in             localeats-api/tests/pickup/schema.sql             supabase/drafts/pickup_launch_foundation.sql             supabase/drafts/pickup_zero_fee.sql             supabase/drafts/merchant_availability.sql             supabase/drafts/pickup_acceptance.sql             localeats-api/tests/pickup/acceptance.sql             localeats-api/tests/pickup/acceptance-volume.sql             localeats-api/tests/pickup/acceptance-race-setup.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
          psql -X -v ON_ERROR_STOP=1 -f localeats-api/tests/pickup/acceptance-race-lock.sql > /tmp/l3n7a-race-holder.log &
          holder=$!
          locked=false
          for attempt in $(seq 1 100); do
            if [ "$(psql -X -At -c "select exists(select 1 from pg_stat_activity where application_name='acceptance-lock-holder' and wait_event='PgSleep')")" = t ]; then locked=true; break; fi
            sleep 0.05
          done
          test "$locked" = true
          psql -X -v ON_ERROR_STOP=1 -f localeats-api/tests/pickup/acceptance-race-accept.sql >/dev/null
          wait "$holder"
          echo 'L3_N7A_ACCEPTANCE_SQL_AND_RACE_PASS'
      - name: Back up and restore orders/events/acceptance notices and push jobs to second disposable database
        run: bash localeats-api/tests/pickup/ci-l3-n7a-acceptance-restore.sh
      - name: Final no hosted activation check
        run: |
          test "$PICKUP_WRITES_ENABLED" = 'false'
          test "$PICKUP_ACCEPTANCE_WORKER_ENABLED" = 'false'
          test "$PICKUP_ACCEPTANCE_PUSH_ENABLED" = 'false'
          test -z "${DATABASE_URL:-}${SUPABASE_URL:-}${SUPABASE_SERVICE_ROLE_KEY:-}${SUPABASE_SECRET_KEY:-}"
          echo 'L3_N7A_NO_PRODUCTION_OR_SHARED_STAGING_CHANGES'
