name: Verified Customer Profiles API — Disabled by Default
on:
  pull_request:
    branches: [main]
    paths:
      - 'localeats-api/src/profiles/**'
      - 'localeats-api/src/routes/customerProfile.ts'
      - 'localeats-api/src/routes/customerProfile.test.ts'
      - 'localeats-api/src/routes/customerProfiles.ts'
      - 'localeats-api/src/routes/customerProfiles.test.ts'
      - 'localeats-api/src/middleware/authenticateFirebase.ts'
      - 'localeats-api/src/server.ts'
      - 'localeats-api/package.json'
      - 'docs/CUSTOMER_PROFILE_API_SECURITY_20261106.md'
      - '.github/workflows/customer-profile-api-verified.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-api-verified:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PROFILE_WRITES_ENABLED: 'false'
      PICKUP_WRITES_ENABLED: 'false'
      RIDER_ACTIVATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localeats-api/package-lock.json
      - run: npm ci --prefix localeats-api --no-audit --no-fund
      - name: Every existing API contract and two-account profile authorization test
        run: npm test --prefix localeats-api
      - name: Verify profile writes and pickup stay default-off
        run: |
          grep -q 'PROFILE_WRITES_ENABLED==="true"' localeats-api/src/routes/customerProfiles.ts
          grep -q 'app.use("/api/v1/profiles", customerProfilesRouter);' localeats-api/src/server.ts
