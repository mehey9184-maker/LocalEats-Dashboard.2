name: LocalPay R4.7 — Isolated Authentication and Pickup Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - 'localeats-api/tests/rewards/r47/**'
      - 'localeats-api/src/rewards/financeActor.ts'
      - 'localeats-api/src/rewards/trustedEvidence.ts'
      - 'localeats-api/src/orders/pickupService.ts'
      - 'localeats-api/src/middleware/authenticateFirebase.ts'
      - 'localeats-api/package.json'
      - '.github/workflows/localpay-r47-auth-evidence-isolated.yml'

permissions:
  contents: read

jobs:
  r47-inert-auth-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PICKUP_WRITES_ENABLED: 'false'
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      REWARDS_ACTIVATION_ENABLED: 'false'
      LOCALPAY_LIVE_WALLET_ENABLED: 'false'
      RIDER_ACTIVATION_ENABLED: 'false'
    steps:
      - name: Checkout draft source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare Node 22 with no real Firebase project
        uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localeats-api/package-lock.json
      - name: Refuse hosted Firebase/Supabase/online payment configuration
        run: |
          test -z "${DATABASE_URL:-}"
          test -z "${DIRECT_URL:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test -z "${FIREBASE_SERVICE_ACCOUNT:-}"
          test -z "${FIREBASE_PRIVATE_KEY:-}"
          test -z "${FIREBASE_PROJECT_ID:-}"
          test "$PICKUP_WRITES_ENABLED" = false
          test "$REWARDS_ACTIVATION_ENABLED" = false
      - name: Install exactly locked dependencies without scripts
        working-directory: localeats-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test strict merchant + customer identity, private pickup proof and known middleware gap
        working-directory: localeats-api
        run: npm run test:r47
      - name: Fail if an R4.7 live route or database migration was introduced
        run: |
          test -f localeats-api/tests/rewards/r47/authenticatedPickupEvidence.mjs
          test -f localeats-api/tests/rewards/r47/authenticatedPickupEvidence.test.mjs
          test ! -e localeats-api/src/rewards/r47AuthRoutes.ts
          test ! -e supabase/migrations/R47_LOCALPAY.sql
