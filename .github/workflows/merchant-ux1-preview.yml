name: Merchant UX1 Shared Feedback Preview
on:
  push:
    branches: [preview/merchant-ux1-shared-feedback-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merchant-ux1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: UX1, Orders toolbar, Riders lock, and inherited merchant regressions
        run: |
          node --experimental-strip-types --test tests/merchant-ux1-feedback.test.mjs tests/merchant-orders-compact-toolbar.test.mjs tests/merchant-riders-coming-soon.test.mjs tests/merchant-riders-r2-filter-clarity.test.mjs tests/merchant-riders-r1-readonly-trust.test.mjs tests/merchant-orders-o6-final-pickup-safety.test.mjs tests/merchant-orders-o5-pickup-history.test.mjs tests/merchant-orders-o4-pickup-first.test.mjs tests/merchant-orders-o3-comms-receipts.test.mjs tests/merchant-orders-o2-confirmed-actions.test.mjs tests/merchant-orders-o1-trust.test.mjs tests/merchant-dashboard-h4-sast-dates.test.mjs tests/merchant-dashboard-h3-freshness.test.mjs tests/merchant-dashboard-h2-layout.test.mjs tests/merchant-dashboard-h1-trust.test.mjs tests/merchant-menu-m3-large-menu-images.test.mjs tests/merchant-menu-m2-usability.test.mjs tests/merchant-menu-m1-trust.test.mjs
      - name: Existing activation and availability guards
        run: |
          node --experimental-strip-types --test tests/merchant-activation.test.mjs tests/merchant-pickup.test.mjs
          npm run test:merchant-availability
      - name: Shared feedback component lint
        run: npx eslint src/components/ui/OperationFeedback.tsx src/components/ui/SavingOverlay.tsx
      - name: Full merchant build
        run: npm run build
