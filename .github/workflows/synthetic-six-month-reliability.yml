name: LocalEats Synthetic Six-Month Reliability Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'localeats-api/tests/synthetic-180day-load.test.mjs'
      - '.github/workflows/synthetic-six-month-reliability.yml'
      - 'docs/LOCAL_EATS_SIX_MONTH_CAPACITY_PLAN.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localeats-api/package-lock.json
      - name: Install API development dependencies (no live env vars)
        run: npm ci --prefix localeats-api --no-audit --no-fund
      - name: Compile existing order service source
        run: npm run build --prefix localeats-api
      - name: Simulate six months with fake in-memory Supabase RPC and FCM
        run: node --test localeats-api/tests/synthetic-180day-load.test.mjs
      - name: Existing production pickup API contract tests
        run: node --test localeats-api/dist/contracts/pickupDraft.test.js localeats-api/dist/orders/pickupService.test.js localeats-api/dist/middleware/pickupWriteGate.test.js localeats-api/dist/orders/orderContract.test.js
