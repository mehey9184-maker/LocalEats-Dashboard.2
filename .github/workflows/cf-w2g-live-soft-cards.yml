name: CF-W2G — LIVE Cloudflare soft-card verification (no deploy)
on:
  push:
    branches:
      - review/cf-w2g-live-verification-20261123
permissions:
  contents: read
jobs:
  live-original-merchant:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Static preview-only contract
        run: node --test tests/cf-w2g-soft-motion.test.mjs
      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund
      - name: Install independent Chromium browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Test actual HTTPS Cloudflare Worker, no local origin substitution
        env:
          CF_W2G_LIVE: 'true'
        run: node tests/cf-w2g-soft-motion-browser.mjs
      - name: Save synthetic screenshots and computed visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cf-w2g-live-cloudflare-soft-cards
          path: artifacts/cf-w2g-soft-motion
          retention-days: 7
          if-no-files-found: ignore
      - name: Never deploy, merge or call real ordering services
        run: echo "CF_W2G_LIVE_BROWSER_ONLY_NO_PRODUCTION_CHANGES"
