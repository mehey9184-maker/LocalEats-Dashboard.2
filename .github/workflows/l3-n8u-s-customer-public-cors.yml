name: L3-N8U-S public Customer exact-origin CORS (offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'localeats-api/src/corsOrigins.ts'
      - 'localeats-api/src/corsOrigins.test.ts'
      - 'docs/L3_N8U_S_OUT_OF_RANGE_CATALOG_AND_CORS.md'
      - '.github/workflows/l3-n8u-s-customer-public-cors.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-cors-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: localeats-api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Ensure no hosted provider credentials
        run: |
          test -z "${FIREBASE_PRIVATE_KEY:-}${SUPABASE_SERVICE_ROLE_KEY:-}${DATABASE_URL:-}${VERCEL_TOKEN:-}${FIREBASE_TOKEN:-}${GOOGLE_APPLICATION_CREDENTIALS:-}"
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build API and run strict exact-origin tests
        run: npm run build && node --test dist/corsOrigins.test.js
      - name: Run full API regressions without external writes
        run: npm test
      - name: No Production deployment
        run: echo L3_N8U_S_SOURCE_ONLY_NO_FLAGS_NO_DEPLOY_NO_PRODUCTION_ACTION
