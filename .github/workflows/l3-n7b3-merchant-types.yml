name: L3-N7B3 Merchant final baseline diagnostics (read-only)
on:
  pull_request:
    branches:
      - review/l3-n7b2-merchant-auth-orders-types
    paths:
      - 'src/**'
      - 'tests/l3-n7b3/**'
      - '.github/workflows/l3-n7b3-merchant-types.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-current-merchant-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      PICKUP_WRITES_ENABLED: 'false'
      RIDER_ACTIVATION_ENABLED: 'false'
      PICKUP_ACCEPTANCE_ENABLED: 'false'
      PICKUP_ACCEPTANCE_WORKER_ENABLED: 'false'
      PICKUP_ACCEPTANCE_PUSH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies without postinstall
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inventory TypeScript and lint without hiding errors
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc -p tsconfig.json --noEmit >/tmp/n7b3-tsc.txt 2>&1 || true
          ./node_modules/.bin/eslint . --format json --output-file /tmp/n7b3-eslint.json >/dev/null 2>&1 || true
          node tests/l3-n7b/report-baseline.mjs /tmp/n7b3-tsc.txt /tmp/n7b3-eslint.json
      - name: Merchant build and pickup contract
        run: |
          npm run test:merchant-pickup
          node --experimental-strip-types --test tests/merchant-command-recovery.test.mjs
          node --experimental-strip-types --test tests/merchant-n7b2-contracts.test.mjs
          node --experimental-strip-types --test tests/l3-n7b3/merchant-safety-contracts.test.mjs
          npm run build
      - name: No Production credentials or unsafe activation
        run: |
          test "$VITE_PICKUP_ORDERING_ENABLED" = false
          test "$PICKUP_WRITES_ENABLED" = false
          test "$PICKUP_ACCEPTANCE_ENABLED" = false
          test "$PICKUP_ACCEPTANCE_WORKER_ENABLED" = false
          test "$PICKUP_ACCEPTANCE_PUSH_ENABLED" = false
          test -z "${DATABASE_URL:-}${SUPABASE_URL:-}${SUPABASE_SERVICE_ROLE_KEY:-}${SUPABASE_SECRET_KEY:-}"
          echo 'L3_N7B3_NO_HOSTED_MUTATIONS'

  independent-type-lint-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Untouched L3-N7B2 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: review/l3-n7b2-merchant-auth-orders-types
          path: baseline
          persist-credentials: false
      - name: L3-N7B3 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: review/l3-n7b3-merchant-final-types
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Install both exact existing lockfiles
        run: |
          npm ci --prefix baseline --ignore-scripts --no-audit --no-fund
          npm ci --prefix candidate --ignore-scripts --no-audit --no-fund
      - name: Require zero NEW TypeScript and ESLint diagnostics with original project rules
        shell: bash
        run: |
          set -euo pipefail
          cd baseline
          ./node_modules/.bin/tsc --noEmit --project tsconfig.json > /tmp/l3n7b3-base-ts.log 2>&1 || true
          ./node_modules/.bin/eslint . --format json --output-file /tmp/l3n7b3-base-eslint.json >/dev/null 2>&1 || true
          cd ../candidate
          ./node_modules/.bin/tsc --noEmit --project tsconfig.json > /tmp/l3n7b3-next-ts.log 2>&1 || true
          ./node_modules/.bin/eslint . --format json --output-file /tmp/l3n7b3-next-eslint.json >/dev/null 2>&1 || true
          node tests/l3-n7b/compare-quality-diagnostics.mjs /tmp/l3n7b3-base-ts.log /tmp/l3n7b3-next-ts.log /tmp/l3n7b3-base-eslint.json /tmp/l3n7b3-next-eslint.json "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/candidate"
          echo 'L3_N7B3_ZERO_NEW_TYPESCRIPT_AND_ESLINT'

  acceptance-feature-temporary-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: n7b3-disposable-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: n7b3-disposable-only
      PGSSLMODE: disable
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      PICKUP_WRITES_ENABLED: 'false'
      RIDER_ACTIVATION_ENABLED: 'false'
      PICKUP_ACCEPTANCE_ENABLED: 'false'
      PICKUP_ACCEPTANCE_WORKER_ENABLED: 'false'
      PICKUP_ACCEPTANCE_PUSH_ENABLED: 'false'
    steps:
      - name: Checkout candidate separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: review/l3-n7b3-merchant-final-types
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout independent acceptance deadline typed draft #175
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: review/l3-n7a-acceptance-typed-cleanup
          path: acceptance
          fetch-depth: 0
          persist-credentials: false
      - name: Test-only merge in runner; never update draft, main, or Production
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}${SUPABASE_URL:-}${SUPABASE_SERVICE_ROLE_KEY:-}${SUPABASE_SECRET_KEY:-}"
          test "$PICKUP_WRITES_ENABLED" = false
          git fetch --no-tags ../acceptance HEAD
          git -c user.name='LocalEats isolated audit' -c user.email='audit@users.noreply.github.com' merge --no-commit --no-ff FETCH_HEAD || {
            echo 'L3_N7B3_ACCEPTANCE_MERGE_CONFLICT'
            git diff --name-only --diff-filter=U
            exit 24
          }
          echo 'L3_N7B3_ACCEPTANCE_DRAFT_COMBINATION_CLEAN'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: API and acceptance contract tests on combined candidate
        working-directory: candidate/localeats-api
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run test:acceptance
      - name: Disposable PostgreSQL acceptance SQL + 2,500 synthetic orders
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = postgres
          for file in localeats-api/tests/pickup/schema.sql supabase/drafts/pickup_launch_foundation.sql supabase/drafts/pickup_zero_fee.sql supabase/drafts/merchant_availability.sql supabase/drafts/pickup_acceptance.sql localeats-api/tests/pickup/acceptance.sql localeats-api/tests/pickup/acceptance-volume.sql localeats-api/tests/pickup/acceptance-race-setup.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
          psql -X -v ON_ERROR_STOP=1 -f localeats-api/tests/pickup/acceptance-race-lock.sql > /tmp/n7b3-holder.log &
          holder=$!
          locked=false
          for attempt in $(seq 1 100); do
            if [ "$(psql -X -At -c "select exists(select 1 from pg_stat_activity where application_name='acceptance-lock-holder' and wait_event='PgSleep')")" = t ]; then locked=true;break;fi
            sleep 0.05
          done
          test "$locked" = true
          psql -X -v ON_ERROR_STOP=1 -f localeats-api/tests/pickup/acceptance-race-accept.sql >/dev/null
          wait "$holder"
          echo 'L3_N7B3_ACCEPTANCE_2500_ORDER_POSTGRES_RACE_PASS'
      - name: Merchant build against combined source, no live ordering
        working-directory: candidate
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Verify no-hosted-writes and no push/worker activation
        run: |
          test "$VITE_PICKUP_ORDERING_ENABLED" = false
          test "$PICKUP_WRITES_ENABLED" = false
          test "$PICKUP_ACCEPTANCE_ENABLED" = false
          test "$PICKUP_ACCEPTANCE_WORKER_ENABLED" = false
          test "$PICKUP_ACCEPTANCE_PUSH_ENABLED" = false
          test -z "${DATABASE_URL:-}${SUPABASE_URL:-}${SUPABASE_SERVICE_ROLE_KEY:-}${SUPABASE_SECRET_KEY:-}"
          echo 'L3_N7B3_NO_HOSTED_ORDERS_PAYMENT_SCHEDULER_OR_PUSH'
