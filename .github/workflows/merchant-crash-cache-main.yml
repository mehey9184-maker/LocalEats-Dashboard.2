name: Merchant Crash Cache Stability Main Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/main.tsx'
      - 'tests/merchant-crash-cache-main.test.mjs'
      - '.github/workflows/merchant-crash-cache-main.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merchant-crash-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Crash/cache, private orders, Riders and pickup regressions
        run: node --experimental-strip-types --test tests/merchant-crash-cache-main.test.mjs tests/merchant-cache-safety-main.test.mjs tests/merchant-riders-coming-soon-main.test.mjs tests/merchant-pickup.test.mjs
      - name: Merchant availability security regressions
        run: node --test tests/merchant-availability.test.cjs
      - name: Full Merchant production build
        run: npm run build
