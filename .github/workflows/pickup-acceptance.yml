name: Pickup acceptance deadlines (synthetic only)
on:
  pull_request:
    paths:
      - 'localeats-api/**'
      - 'supabase/drafts/pickup_acceptance.sql'
      - 'src/components/PickupReception.tsx'
      - 'src/services/pickupReception.ts'
      - 'tests/pickup-reception-browser.mjs'
      - '.github/workflows/pickup-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: localeats-api
      - run: npm test && npm run test:acceptance
        working-directory: localeats-api
      - name: Disposable database lifecycle, 2500 requests and backlog
        run: |
          for file in localeats-api/tests/pickup/schema.sql supabase/drafts/pickup_launch_foundation.sql supabase/drafts/pickup_zero_fee.sql supabase/drafts/merchant_availability.sql supabase/drafts/pickup_acceptance.sql localeats-api/tests/pickup/acceptance.sql localeats-api/tests/pickup/acceptance-volume.sql localeats-api/tests/pickup/acceptance-race-setup.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done
          psql -X -v ON_ERROR_STOP=1 -f localeats-api/tests/pickup/acceptance-race-lock.sql > /tmp/acceptance-lock.log &
          lock_pid=$!
          locked=false
          for attempt in $(seq 1 100); do
            if [ "$(psql -X -At -c "select exists(select 1 from pg_stat_activity where application_name='acceptance-lock-holder' and wait_event='PgSleep')")" = t ]; then locked=true; break; fi
            sleep 0.05
          done
          test "$locked" = true
          psql -X -v ON_ERROR_STOP=1 -f localeats-api/tests/pickup/acceptance-race-accept.sql
          wait "$lock_pid"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Merchant reception UI, synthetic auth/API only
        run: node tests/pickup-reception-browser.mjs
