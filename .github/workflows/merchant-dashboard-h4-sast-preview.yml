name: Merchant Home H4 SAST Dates Preview
on:
  push:
    branches: [repair/merchant-home-h4-sast-dates-01]
  pull_request:
    branches: [repair/merchant-dashboard-h3-performance-01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merchant-h4:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: H4 SAST date tests and previous Home regressions
        run: node --experimental-strip-types --test tests/merchant-dashboard-h4-sast-dates.test.mjs tests/merchant-dashboard-h3-freshness.test.mjs tests/merchant-dashboard-h2-layout.test.mjs tests/merchant-dashboard-h1-trust.test.mjs
      - name: Existing Merchant activation and pickup security regressions
        run: node --experimental-strip-types --test tests/merchant-activation.test.mjs tests/merchant-pickup.test.mjs
      - name: Existing Merchant availability regressions
        run: npm run test:merchant-availability
      - name: No new ESLint errors in Home helpers
        run: npx eslint src/services/merchantDashboardTrust.ts src/services/merchantDashboardLayout.ts src/services/merchantDashboardFreshness.ts
      - name: Compare Home App and Dashboard lint against H3 Preview
        run: node tests/merchant-dashboard-h1-lint-baseline.mjs
        env:
          MERCHANT_DASHBOARD_LINT_BASE: "ff290afb302f139d91648f1e68d9c8a0240fb4f1"
      - name: Complete Merchant Preview build
        run: npm run build
