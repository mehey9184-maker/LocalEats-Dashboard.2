name: Merchant P1 device logout and unpaid pickup clarity
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/services/MerchantApi.ts'
      - 'src/components/PickupOrderActions.tsx'
      - 'tests/merchant-push-logout-unpaid-p1.test.mjs'
      - '.github/workflows/merchant-push-logout-p1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-logout-and-ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - run: node --test tests/merchant-push-logout-unpaid-p1.test.mjs
