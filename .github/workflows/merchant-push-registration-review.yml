name: Merchant push registration and inbox resilience review
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/hooks/usePushNotifications.ts'
      - 'src/services/MerchantApi.ts'
      - 'src/App.tsx'
      - 'tests/merchant-push-registration.test.mjs'
      - '.github/workflows/merchant-push-registration-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Static merchant push security/recovery contracts
        run: node --test tests/merchant-push-registration.test.mjs
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production merchant build
        run: npm run build
