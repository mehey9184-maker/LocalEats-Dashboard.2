name: Merchant Dashboard H3 Performance Preview
on:
  push:
    branches: [repair/merchant-dashboard-h3-performance-01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merchant-h3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: H3 freshness, H2 usability and H1 trust regression tests
        run: node --experimental-strip-types --test tests/merchant-dashboard-h3-freshness.test.mjs tests/merchant-dashboard-h2-layout.test.mjs tests/merchant-dashboard-h1-trust.test.mjs
      - name: Existing Merchant activation and pickup security regressions
        run: node --experimental-strip-types --test tests/merchant-activation.test.mjs tests/merchant-pickup.test.mjs
      - name: Existing Merchant availability regressions
        run: npm run test:merchant-availability
      - name: No new ESLint errors in H3 helper
        run: npx eslint src/services/merchantDashboardTrust.ts src/services/merchantDashboardLayout.ts src/services/merchantDashboardFreshness.ts
      - name: Compare H3 App and Dashboard lint against H2 Preview
        run: node tests/merchant-dashboard-h1-lint-baseline.mjs
        env:
          MERCHANT_DASHBOARD_LINT_BASE: "b8ea86d9603c9734e2fff48eec8292a98845c4a0"
      - name: Complete Merchant Preview build
        run: npm run build
