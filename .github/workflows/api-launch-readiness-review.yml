name: API Firebase Admin launch-readiness gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'localeats-api/src/routes/health.ts'
      - 'localeats-api/src/routes/health.test.ts'
      - '.github/workflows/api-launch-readiness-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localeats-api/package-lock.json
      - name: Install API locked dependencies
        run: npm ci --prefix localeats-api --no-audit --no-fund
      - name: Build actual API
        run: npm run build --prefix localeats-api
      - name: Test fail-closed launch readiness
        run: node --test localeats-api/dist/routes/health.test.js
