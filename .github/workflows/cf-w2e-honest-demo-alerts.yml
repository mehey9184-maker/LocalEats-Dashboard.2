name: CF-W2E — Honest fictional order alerts (preview only; no deploy)
on:
  push:
    branches:
      - review/cf-w2e-honest-demo-alerts-20261123
  pull_request:
    paths:
      - 'src/services/cloudflareDemoIncomingAlerts.ts'
      - 'src/components/PreviewFakeOrders.tsx'
      - 'src/components/OrdersManagement.tsx'
      - 'src/components/OrdersFocusedWorkspace.tsx'
      - 'tests/cf-w2e-honest-demo-alerts*'
      - '.github/workflows/cf-w2e-honest-demo-alerts.yml'
permissions:
  contents: read
jobs:
  fictional-preview-alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      VITE_MERCHANT_CF_DEMO_READ_ONLY: 'true'
      VITE_MERCHANT_PREVIEW_READ_ONLY: 'true'
      VITE_MERCHANT_FAKE_ORDERS_ENABLED: 'true'
      VITE_MERCHANT_ORDERS_FOCUSED_UI: 'true'
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      VITE_LOCALEATS_API_URL: ''
      VITE_FIREBASE_CONFIG_SOURCE: 'environment'
      VITE_FIREBASE_API_KEY: 'fictional-local-demo-only'
      VITE_FIREBASE_AUTH_DOMAIN: 'localeats-fictional-demo.invalid'
      VITE_FIREBASE_PROJECT_ID: 'localeats-fictional-demo'
      VITE_FIREBASE_STORAGE_BUCKET: 'localeats-fictional-demo.invalid'
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:fictional-demo-only'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: No backend push, production credentials, real orders or UI redesign
        run: node --test tests/cf-w2e-honest-demo-alerts.test.mjs tests/merchant-vendor-arrivals-preview.test.mjs tests/cf-w2c-merchant-cloudflare.test.mjs
      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund
      - name: Existing TypeScript baseline — reject errors in new notification implementation
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit > "$RUNNER_TEMP/cf-w2e-types.log" 2>&1 || true
          echo "Existing full-project TypeScript errors: $(grep -c 'error TS' "$RUNNER_TEMP/cf-w2e-types.log" || true)"
          if grep -E '^src/(services/cloudflareDemoIncomingAlerts\\.ts|components/(PreviewFakeOrders|OrdersFocusedWorkspace)\\.tsx)\\(' "$RUNNER_TEMP/cf-w2e-types.log"; then
            echo "New preview notification files must be TypeScript error-free"; exit 1
          fi
          if grep -E '^src/components/OrdersManagement\\.tsx\\(' "$RUNNER_TEMP/cf-w2e-types.log" | grep -Ev "TS2304: Cannot find name 'setLayoutMode'|TS2367: This comparison appears to be unintentional"; then
            echo "Unexpected OrdersManagement TypeScript regression"; exit 1
          fi
          echo "Full-project baseline TypeScript errors remain outside CF-W2E scope; not claiming a clean root typecheck."
      - name: Build isolated original Merchant app and scan for production credentials
        run: |
          npx vite build --config preview/merchant-pitch/vite.config.ts
          test -f dist-merchant-pitch/index.html
          ! grep -RIE 'localeats-api-cf1-staging|dashboard.localeatssa.co.za/api|firebaseapp.com|SUPABASE_SERVICE_ROLE_KEY|DATABASE_URL|service_role' dist-merchant-pitch/
      - name: Install Chromium browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Test example browser notification and sound in original Orders
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --config preview/merchant-pitch/vite.config.ts --host 127.0.0.1 --port 4177 --strictPort > "$RUNNER_TEMP/cf-w2e-vite.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:4177/ >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then tail -n 70 "$RUNNER_TEMP/cf-w2e-vite.log"; exit 1; fi
          node tests/cf-w2e-honest-demo-alerts-browser.mjs
      - name: Save synthetic preview screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cf-w2e-fictional-notification-sound-evidence
          path: artifacts/cf-w2e-alerts
          retention-days: 7
          if-no-files-found: ignore
      - name: No deployment or production modification
        run: echo "CF_W2E_PREVIEW_SOUNDS_AND_FOREGROUND_BROWSER_NOTIFICATIONS_ONLY_NO_WEB_PUSH_NO_DEPLOY"
