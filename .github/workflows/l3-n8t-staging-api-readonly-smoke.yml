name: L3-N8T paired staging API read-only smoke
on:
  pull_request:
    branches:
      - review/l3-n8p-staging-rollback-rehearsal
    paths:
      - 'tests/l3-n8t/**'
      - 'docs/L3_N8T_PREVIEW_ONLY_API_PAIRING.md'
      - '.github/workflows/l3-n8t-staging-api-readonly-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  token-free-stage-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Prevent hosted credential leaks
        run: |
          test -z "${SUPABASE_URL:-}${SUPABASE_SERVICE_ROLE_KEY:-}${DATABASE_URL:-}${VERCEL_TOKEN:-}${FIREBASE_TOKEN:-}${GOOGLE_APPLICATION_CREDENTIALS:-}${FIREBASE_PRIVATE_KEY:-}"
      - name: Read-only health + CORS preflight + negative auth checks on isolated N8O API
        run: node --test tests/l3-n8t/staging-api-unauthenticated-smoke.test.mjs
