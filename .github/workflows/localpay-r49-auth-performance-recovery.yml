name: LocalPay R4.9 — Isolated Staging-Like Auth Performance and Recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - 'localeats-api/tests/rewards/r49/**'
      - 'localeats-api/src/middleware/authenticateFirebase.ts'
      - 'localeats-api/src/routes/orders.ts'
      - 'localeats-api/package.json'
      - '.github/workflows/localpay-r49-auth-performance-recovery.yml'

permissions:
  contents: read

jobs:
  r49-fake-staging-auth-and-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-localeats-r49
      PICKUP_WRITES_ENABLED: 'false'
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      REWARDS_ACTIVATION_ENABLED: 'false'
      LOCALPAY_LIVE_WALLET_ENABLED: 'false'
      RIDER_ACTIVATION_ENABLED: 'false'
    steps:
      - name: Checkout draft source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22 for local Firebase Auth Emulator
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localeats-api/package-lock.json
      - name: Refuse real staging or Production credentials and financial activation
        run: |
          test "$GCLOUD_PROJECT" = demo-localeats-r49
          test -z "${FIREBASE_PROJECT_ID:-}"
          test -z "${FIREBASE_CLIENT_EMAIL:-}"
          test -z "${FIREBASE_PRIVATE_KEY:-}"
          test -z "${FIREBASE_SERVICE_ACCOUNT:-}"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${DIRECT_URL:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_DB_URL:-}"
          test "$PICKUP_WRITES_ENABLED" = false
          test "$REWARDS_ACTIVATION_ENABLED" = false
      - name: Install locked dependencies without project scripts
        working-directory: localeats-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build actual LocalEats API middleware and pickup routes
        working-directory: localeats-api
        run: npm run build
      - name: Test real compiled routes with emulator identities and in-memory shop/order store
        working-directory: localeats-api
        run: |
          npx --yes firebase-tools@15.35.0 emulators:exec \
            --only auth --project demo-localeats-r49 \
            --config tests/rewards/r48/firebase.emulator.json \
            "node --test tests/rewards/r49/stagingLikeAuthFlow.test.mjs"
      - name: Verify real backend/migrations/rewards remain untouched
        run: |
          test -f localeats-api/tests/rewards/r49/stagingLikeAuthFlow.test.mjs
          test ! -e localeats-api/src/rewards/r49RewardsRoutes.ts
          test ! -e supabase/migrations/R49_LOCALPAY.sql
