name: Pickup read-only Preview notification inbox safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'localeats-api/src/routes/pickupNotifications.ts'
      - 'localeats-api/src/middleware/previewReadOnlyGate.ts'
      - 'localeats-api/src/middleware/previewReadOnlyGate.test.ts'
      - '.github/workflows/pickup-preview-notification-inbox.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-inbox-no-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localeats-api/package-lock.json
      - name: Install locked dependencies without live credentials
        run: npm ci --prefix localeats-api --no-audit --no-fund
      - name: Compile API
        run: npm run build --prefix localeats-api
      - name: Verify Preview gate, scoped notifications and pickup contract
        working-directory: localeats-api
        run: node --test dist/middleware/previewReadOnlyGate.test.js dist/routes/pickup.test.js
