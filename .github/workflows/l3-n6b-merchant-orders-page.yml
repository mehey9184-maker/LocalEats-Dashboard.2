name: L3-N6B Full Merchant Orders Page — Read-only Chromium
on:
  pull_request:
    branches:
      - review/l3-n3-customer-push-preview-admission
    paths:
      - 'tests/l3-n6b/**'
      - 'src/components/OrdersManagement.tsx'
      - 'src/components/PickupOrderActions.tsx'
      - 'src/services/MerchantApi.ts'
      - 'src/services/merchantPickupPolicy.ts'
      - '.github/workflows/l3-n6b-merchant-orders-page.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-orders-page-no-write-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      PICKUP_WRITES_ENABLED: 'false'
      RIDER_ACTIVATION_ENABLED: 'false'
      VITE_MERCHANT_PREVIEW_READ_ONLY: 'true'
      VITE_MERCHANT_FAKE_ORDERS_ENABLED: 'false'
    steps:
      - name: Check out existing draft Merchant source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Fail closed before browser build
        shell: bash
        run: |
          set -euo pipefail
          test "$VITE_PICKUP_ORDERING_ENABLED" = 'false'
          test "$PICKUP_WRITES_ENABLED" = 'false'
          test "$RIDER_ACTIVATION_ENABLED" = 'false'
          test "$VITE_MERCHANT_PREVIEW_READ_ONLY" = 'true'
          test -z "${DATABASE_URL:-}${SUPABASE_URL:-}${SUPABASE_SERVICE_ROLE_KEY:-}${SUPABASE_SECRET_KEY:-}"
          ! grep -ERn 'https://|supabase[.]co|firebaseapp[.]com|vercel deploy|--prod' tests/l3-n6b/
      - name: Install Merchant dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Merchant pickup contract and command recovery
        run: |
          npm run test:merchant-pickup
          node --experimental-strip-types --test tests/merchant-command-recovery.test.mjs
      - name: Build actual unchanged Merchant app with pickup OFF
        run: npm run build
      - name: Set up isolated Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real OrdersManagement page, verified shop, read-only and mobile checks
        run: node tests/l3-n6b/run-orders-page.mjs
      - name: Verify no Merchant source changed or real write flags toggled
        shell: bash
        run: |
          set -euo pipefail
          test "$VITE_PICKUP_ORDERING_ENABLED" = 'false'
          test "$PICKUP_WRITES_ENABLED" = 'false'
          git diff --exit-code -- src/components/OrdersManagement.tsx src/services/MerchantApi.ts src/components/PickupOrderActions.tsx
          echo "L3_N6B_NO_HOSTED_ORDER_WRITES"
