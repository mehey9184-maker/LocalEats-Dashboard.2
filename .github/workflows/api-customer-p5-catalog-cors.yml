name: API Customer P5 Catalog CORS Preview
on:
  push:
    branches: [repair/customer-p5-catalog-preview-cors-01]
  pull_request:
    branches: [repair/push-both-sides-api-preview-01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: localeats-api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localeats-api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: All existing API pickup and security regressions
        run: npm test
      - name: Customer Ready recipient and both-side wake tests
        run: node --test dist/orders/pickupPushRecipient.test.js dist/orders/confirmedPickupWake.test.js
