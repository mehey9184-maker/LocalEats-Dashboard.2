name: LocalPay R4.2 — Disposable PostgreSQL 17 Financial Rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - 'localeats-api/tests/rewards/r42/**'
      - '.github/workflows/localpay-r42-disposable-postgres.yml'
      - 'localeats-api/package.json'

permissions:
  contents: read

jobs:
  r42-disposable-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localpay-synthetic-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOCALPAY_R42_ISOLATED: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: localpay-synthetic-only
      PGSSLMODE: disable
      PGDATABASE: localpay_r42_disposable
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      PICKUP_WRITES_ENABLED: 'false'
      RIDER_ACTIVATION_ENABLED: 'false'
      REWARDS_ACTIVATION_ENABLED: 'false'
      LOCALPAY_LIVE_WALLET_ENABLED: 'false'
    steps:
      - name: Checkout draft source without persistent GitHub credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prove no network/hosted connection is supplied
        run: |
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${DIRECT_URL:-}"
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = localpay_r42_disposable
          psql --version
          PGDATABASE=postgres createdb localpay_r42_disposable
          test "$(psql -X -At -c 'select current_database()')" = localpay_r42_disposable
      - name: R4.2 cross-connection caps, rollback, double-spend, immutable journal and fake bank proof
        run: bash localeats-api/tests/rewards/r42/run-isolated-r42.sh
      - name: Confirm R4.2 never created real API routes, migrations or a wallet
        run: |
          test -f localeats-api/tests/rewards/r42/ledger.SYNTHETIC_ONLY.sql
          test -f localeats-api/tests/rewards/r42/run-isolated-r42.sh
          test ! -e supabase/migrations/R42_LOCALPAY.sql
          test ! -e localeats-api/src/rewards/r42LocalPayRoutes.ts
