name: LocalEats R5.2 — Isolated Hosted Staging Evidence Policy (Offline Only)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'localeats-api/tests/rewards/r52/**'
      - '.github/workflows/localpay-r52-hosted-staging-preflight.yml'

permissions:
  contents: read

jobs:
  isolation-evidence-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PICKUP_WRITES_ENABLED: 'false'
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      PROFILE_WRITES_ENABLED: 'false'
      REWARDS_ACTIVATION_ENABLED: 'false'
      LOCALPAY_LIVE_WALLET_ENABLED: 'false'
    steps:
      - name: Checkout API draft without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22 isolated evidence tests only
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Refuse hosted Firebase, Supabase and service credentials
        run: |
          test -z "${FIREBASE_PROJECT_ID:-}"
          test -z "${FIREBASE_PRIVATE_KEY:-}"
          test -z "${FIREBASE_SERVICE_ACCOUNT:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test "$PICKUP_WRITES_ENABLED" = false
          test "$REWARDS_ACTIVATION_ENABLED" = false
      - name: Test fail-closed staging isolation metadata policy
        run: node --test localeats-api/tests/rewards/r52/stagingIsolationGate.test.mjs
      - name: No hosted request or financial activation in R5.2 contract
        run: |
          test -f localeats-api/tests/rewards/r52/stagingIsolationGate.mjs
          test ! -e localeats-api/src/rewards/r52LocalPayRoutes.ts
          test ! -e supabase/migrations/R52_LOCALPAY.sql
