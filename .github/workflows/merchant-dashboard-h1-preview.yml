name: Merchant Dashboard H1 preview trust checks
on:
  push:
    branches: [repair/merchant-dashboard-h1-trust-01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merchant-h1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: H1 trust, bank/POS, completed order metrics, CSV and diagnostic tests
        run: node --experimental-strip-types --test tests/merchant-dashboard-h1-trust.test.mjs
      - name: Existing merchant activation and pickup security regressions
        run: node --experimental-strip-types --test tests/merchant-activation.test.mjs tests/merchant-pickup.test.mjs
      - name: Existing merchant availability regressions
        run: npm run test:merchant-availability
      - name: Frontend lint
        run: npm run lint
      - name: Complete Merchant Preview build
        run: npm run build
