name: L3-N8N designated-shop and paired staging regressions
on:
  pull_request:
    branches: [review/l3-n8m-dormant-customer-community-contract]
permissions:
  contents: read
jobs:
  api-and-merchant:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Synthetic designated shop, inbox, scope and exact CORS tests
        run: node --experimental-strip-types --test tests/l3-n8n/*.test.mjs
      - name: Existing API build and complete regression suite
        run: |
          npm ci --prefix localeats-api --ignore-scripts --no-audit --no-fund
          npm test --prefix localeats-api
          node --test localeats-api/dist/middleware/authenticateFirebase.n8d.test.js
      - name: Existing Merchant typecheck, lint, pickup and revalidation regressions
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/tsc --project tsconfig.json --noEmit
          npm run lint
          npm run test:merchant-pickup
          node --experimental-strip-types --test tests/merchant-shop-revalidation.test.mjs

