name: L4-R1 — Merchant lint and TS debt audit (NO DEPLOY)
on:
  push:
    branches: [integration/l4-r1-merchant-api-zero-write-20261123, quality/l4-r1b-safe-cleanup-20261123, repair/l4-r1c-functional-contracts-20261123, quality/l4-r1d-contract-lint-20261123, release/l4-pickup-core-main-20261123]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'eslint.config.js'
      - 'tsconfig.json'
      - '.github/workflows/l4-r1-merchant-quality-audit.yml'
permissions:
  contents: read
jobs:
  eslint:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Root ESLint - report genuine status, never suppress failures
        run: npm run lint
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Merchant root TypeScript --noEmit
        run: npx tsc --noEmit --pretty false
