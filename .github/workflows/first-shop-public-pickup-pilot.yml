name: First-shop public pickup pilot admission and safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'localeats-api/src/middleware/controlledPickup.ts'
      - 'localeats-api/src/middleware/controlledPickup.test.ts'
      - 'localeats-api/src/routes/orders.ts'
      - 'docs/LOCALEATS_FIRST_SHOP_PUBLIC_PILOT_2026-11-22.md'
      - '.github/workflows/first-shop-public-pickup-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-shop-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PICKUP_WRITES_ENABLED: 'false'
      PICKUP_PUBLIC_PILOT_ENABLED: 'false'
      MERCHANT_AVAILABILITY_WRITES_ENABLED: 'false'
      RIDER_ACTIVATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - run: npm ci --prefix localeats-api --no-audit --no-fund
      - name: Full pickup API and time-limited public pilot contract suite
        run: npm test --prefix localeats-api
      - name: Confirm CI never enables live pickup, merchant or Riders
        run: |
          test "$PICKUP_WRITES_ENABLED" = false
          test "$PICKUP_PUBLIC_PILOT_ENABLED" = false
          test "$MERCHANT_AVAILABILITY_WRITES_ENABLED" = false
          test "$RIDER_ACTIVATION_ENABLED" = false
          echo FIRST_SHOP_PUBLIC_PILOT_SOURCE_PASS
