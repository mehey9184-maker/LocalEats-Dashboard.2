name: Customer Motion M1 API Preview CORS

on:
  push:
    branches: [preview/customer-m1-api-origin-20261104]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-motion-api-cors:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: localeats-api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localeats-api/package-lock.json
      - name: Install clean API dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and run API safety regressions
        run: npm test
      - name: Verify exact Motion branch origin and deny lookalikes
        run: node test-customer-motion-preview-origin.mjs
