name: Merchant Menu M1 Read-only Trust Preview
on:
  push:
    branches: [repair/merchant-menu-m1-readonly-trust-01]
  pull_request:
    branches: [repair/merchant-orders-o6-final-pickup-safety-01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merchant-menu-m1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Menu M1 and O6/O5/O4/O3/O2/O1 Orders plus H4/H3/H2/H1 trust regressions
        run: node --experimental-strip-types --test tests/merchant-menu-m1-trust.test.mjs tests/merchant-orders-o6-final-pickup-safety.test.mjs tests/merchant-orders-o5-pickup-history.test.mjs tests/merchant-orders-o4-pickup-first.test.mjs tests/merchant-orders-o3-comms-receipts.test.mjs tests/merchant-orders-o2-confirmed-actions.test.mjs tests/merchant-orders-o1-trust.test.mjs tests/merchant-dashboard-h4-sast-dates.test.mjs tests/merchant-dashboard-h3-freshness.test.mjs tests/merchant-dashboard-h2-layout.test.mjs tests/merchant-dashboard-h1-trust.test.mjs
      - name: Merchant activation, pickup and availability checks
        run: |
          node --experimental-strip-types --test tests/merchant-activation.test.mjs tests/merchant-pickup.test.mjs
          npm run test:merchant-availability
      - name: Pure helper ESLint
        run: npx eslint src/services/merchantMenuPolicy.ts src/services/merchantOrdersTrust.ts src/services/merchantDashboardLayout.ts src/components/DispatchAlertModal.tsx
      - name: No new lint errors compared with owner-reviewed Orders O6
        run: node tests/merchant-dashboard-h1-lint-baseline.mjs
        env:
          MERCHANT_DASHBOARD_LINT_BASE: "1f19d000a991f6ceb113a801c9c159da0a8661c0"
      - name: Full Merchant Preview build
        run: npm run build
