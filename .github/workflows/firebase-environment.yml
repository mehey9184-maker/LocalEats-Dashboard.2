name: Firebase environment isolation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/firebase.ts'
      - 'src/lib/merchantSessionMetadata.ts'
      - 'src/lib/supabase.ts'
      - 'src/services/merchantPickupPolicy.ts'
      - 'src/services/MerchantApi.ts'
      - 'src/services/merchantPickupRecovery.ts'
      - 'src/components/OrdersManagement.tsx'
      - 'src/utils/receiptText.ts'
      - 'tests/merchant-pickup.test.mjs'
      - 'tests/merchant-activation.test.mjs'
      - 'tests/merchant-command-recovery.test.mjs'
      - 'tests/firebase-environment.test.mjs'
      - 'tests/merchant-firebase-session-metadata.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/firebase-environment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firebase-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/firebase-environment.test.mjs tests/merchant-firebase-session-metadata.test.mjs tests/merchant-pickup.test.mjs tests/merchant-riders-coming-soon-main.test.mjs tests/merchant-activation.test.mjs tests/merchant-command-recovery.test.mjs
      - run: npm run build
