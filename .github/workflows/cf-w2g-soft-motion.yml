name: CF-W2G — Live-feeling Orders polish (preview only, no deploy)
on:
  push:
    branches:
      - review/cf-w2g-soft-motion-order-cards-20261123
  pull_request:
    paths:
      - 'src/components/OrdersFocusedWorkspace.tsx'
      - 'src/components/OrdersStyleBoard.tsx'
      - 'src/components/PreviewFakeOrders.tsx'
      - 'tests/cf-w2g-*'
      - '.github/workflows/cf-w2g-soft-motion.yml'
permissions:
  contents: read
jobs:
  soft-order-cards:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VITE_MERCHANT_CF_DEMO_READ_ONLY: 'true'
      VITE_MERCHANT_PREVIEW_READ_ONLY: 'true'
      VITE_MERCHANT_FAKE_ORDERS_ENABLED: 'true'
      VITE_MERCHANT_ORDERS_FOCUSED_UI: 'true'
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      VITE_LOCALEATS_API_URL: ''
      VITE_FIREBASE_CONFIG_SOURCE: 'environment'
      VITE_FIREBASE_API_KEY: 'fictional-local-demo-only'
      VITE_FIREBASE_AUTH_DOMAIN: 'localeats-fictional-demo.invalid'
      VITE_FIREBASE_PROJECT_ID: 'localeats-fictional-demo'
      VITE_FIREBASE_STORAGE_BUCKET: 'localeats-fictional-demo.invalid'
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:fictional-demo-only'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Verify isolated polish, original UI and no order writes
        run: |
          node --test tests/cf-w2g-soft-motion.test.mjs tests/cf-w2f-mobile-orders-polish.test.mjs tests/cf-w2e-honest-demo-alerts.test.mjs tests/cf-w2c-merchant-cloudflare.test.mjs tests/merchant-vendor-arrivals-preview.test.mjs tests/merchant-riders-coming-soon-main.test.mjs
      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund
      - name: Check touched components for new TypeScript errors
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit > "$RUNNER_TEMP/cf-w2g-types.log" 2>&1 || true
          echo "Root TypeScript baseline errors remain tracked separately: $(grep -c 'error TS' "$RUNNER_TEMP/cf-w2g-types.log" || true)"
          if grep -E '^src/components/(OrdersFocusedWorkspace|OrdersStyleBoard|PreviewFakeOrders)\\.tsx\\(' "$RUNNER_TEMP/cf-w2g-types.log"; then
            echo "New visual polish cannot introduce component TS errors"; exit 1
          fi
      - name: Build isolated original Merchant Dashboard, scan for Production config
        run: |
          npx vite build --config preview/merchant-pitch/vite.config.ts
          test -f dist-merchant-pitch/index.html
          ! grep -RIE 'localeats-api-cf1-staging|dashboard.localeatssa.co.za/api|firebaseapp.com|SUPABASE_SERVICE_ROLE_KEY|DATABASE_URL|service_role' dist-merchant-pitch/
      - name: Install Chromium browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Validate typography, soft-card depth, reduced motion and original order actions
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --config preview/merchant-pitch/vite.config.ts --host 127.0.0.1 --port 4177 --strictPort > "$RUNNER_TEMP/cf-w2g-vite.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:4177/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then tail -n 60 "$RUNNER_TEMP/cf-w2g-vite.log"; exit 1; fi
          node tests/cf-w2g-soft-motion-browser.mjs
          node tests/cf-w2f-mobile-orders-browser.mjs
      - name: Upload fictional-only visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cf-w2g-soft-motion-review
          path: |
            artifacts/cf-w2g-soft-motion
            artifacts/cf-w2f-mobile-orders
          retention-days: 7
          if-no-files-found: ignore
      - name: No Production deployment, no main merge, no real orders
        run: echo "CF_W2G_ISOLATED_PREVIEW_POLISH_ONLY"
