name: API customer Ready push recipient checks
on:
  push:
    branches: [repair/pickup-ready-customer-push-recipient-01]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: localeats-api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localeats-api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API test suite
        run: npm test
      - name: Push recipient regression
        run: node --test dist/orders/pickupPushRecipient.test.js
