name: L3-N5 Disposable PostgreSQL Pickup Journey (synthetic only)
on:
  pull_request:
    branches:
      - review/l3-n3-customer-push-preview-admission
    paths:
      - 'localeats-api/tests/pickup/**'
      - 'localeats-api/src/routes/orders.ts'
      - 'localeats-api/src/routes/catalog.ts'
      - 'localeats-api/src/orders/pickupService.ts'
      - 'localeats-api/src/orders/privateMyKotaSafety.ts'
      - 'supabase/drafts/pickup_launch_foundation.sql'
      - 'supabase/drafts/pickup_zero_fee.sql'
      - 'supabase/drafts/merchant_availability.sql'
      - '.github/workflows/l3-n5-disposable-pickup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-two-app-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No existing/staging/Production database is used. The service and database
    # are created and automatically destroyed by the ephemeral Actions runner.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only-do-not-reuse
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-only-do-not-reuse
      PGSSLMODE: disable
      PGDATABASE: local_pickup_qa
      PICKUP_TEST_ISOLATED: '1'
      VITE_PICKUP_ORDERING_ENABLED: 'false'
      PICKUP_WRITES_ENABLED: 'false'
      RIDER_ACTIVATION_ENABLED: 'false'
    steps:
      - name: Checkout review-only API
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout owner-accepted Customer adapter (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mehey9184-maker/LocalEats-app
          ref: c77736e7b4878965baa31ec2ada8138f554d6a7f # L3 owner-accepted PR #115
          path: customer-original-ui
          persist-credentials: false
      - name: Verify isolated CI boundary and original adapters
        shell: bash
        run: |
          set -euo pipefail
          test -f customer-original-ui/src/pickup/client.ts
          test -f src/pickup/client.ts
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'local_pickup_qa'
          test "$PICKUP_TEST_ISOLATED" = '1'
          test -z "${SUPABASE_URL:-}${DATABASE_URL:-}${SUPABASE_SERVICE_ROLE_KEY:-}${SUPABASE_SECRET_KEY:-}"
          ln -s "$GITHUB_WORKSPACE/customer-original-ui" "$GITHUB_WORKSPACE/../customer-original-ui"
          psql --version
          pg_dump --version
          pg_restore --version
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: localeats-api/package-lock.json
      - name: Install API dependencies without secrets
        run: npm ci --prefix localeats-api --no-audit --no-fund
      - name: Compile actual pickup API and HTTP route handlers
        run: npm run build --prefix localeats-api
      - name: Create isolated synthetic PostgreSQL 17 database
        shell: bash
        run: |
          set -euo pipefail
          PGDATABASE=postgres createdb local_pickup_qa
          test "$(psql -X -At -v ON_ERROR_STOP=1 -c 'select current_database()')" = "local_pickup_qa"
      - name: Real HTTP Customer and Merchant adapters, SQL lifecycle, races, retries and push-outbox
        run: bash localeats-api/tests/pickup/ci-isolated-journey.sh
      - name: Dump and restore fabricated orders/events/outbox to a SECOND disposable database
        run: bash localeats-api/tests/pickup/ci-l3-n5-restore.sh
      - name: Final no-Production safety assertions
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_URL:-}${DATABASE_URL:-}${SUPABASE_SERVICE_ROLE_KEY:-}${SUPABASE_SECRET_KEY:-}"
          test "$(psql -X -v ON_ERROR_STOP=1 -At -c "select count(*) from public.orders where shop_id='private-test-my-kota-preview'")" = "0"
          test "$PICKUP_WRITES_ENABLED" = 'false'
          test "$VITE_PICKUP_ORDERING_ENABLED" = 'false'
          test ! -e local_pickup_qa_restore.dump
          echo "L3_N5_ISOLATED_HTTP_POSTGRES_COMPLETE_NO_HOSTED_WRITES"
