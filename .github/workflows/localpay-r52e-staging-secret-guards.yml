name: LocalEats R5.2E — API Staging Secrets Fail-Closed (Offline Only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'localeats-api/src/lib/r52eStagingSafety.ts'
      - 'localeats-api/src/lib/firebaseAdmin.ts'
      - 'localeats-api/src/lib/supabaseAdmin.ts'
      - 'localeats-api/tests/r52e/**'
      - '.github/workflows/localpay-r52e-staging-secret-guards.yml'
permissions:
  contents: read
jobs:
  synthetic-stage-secret-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PICKUP_WRITES_ENABLED: 'false'
      PROFILE_WRITES_ENABLED: 'false'
      RIDER_ACTIVATION_ENABLED: 'false'
      REWARDS_ACTIVATION_ENABLED: 'false'
      LOCALPAY_LIVE_WALLET_ENABLED: 'false'
      LOCALEATS_STAGING_ONLY: 'false'
    steps:
      - name: Checkout draft without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22 only, no live connection
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Refuse actual hosted secrets in the test job
        shell: bash
        run: |
          set -euo pipefail
          for key in FIREBASE_PROJECT_ID FIREBASE_PRIVATE_KEY FIREBASE_CLIENT_EMAIL FIREBASE_AUTH_EMULATOR_HOST SUPABASE_URL SUPABASE_SECRET_KEY SUPABASE_SERVICE_ROLE_KEY DATABASE_URL; do
            test -z "$(printenv "$key" || true)"
          done
          test "$PICKUP_WRITES_ENABLED" = false
          test "$LOCALPAY_LIVE_WALLET_ENABLED" = false
      - name: Execute synthetic-only staging credential policy tests
        run: node --experimental-strip-types --test localeats-api/tests/r52e/stagingCredentials.test.mjs
      - name: Refuse a hosted staging SQL migration or wallet activation in R5.2E
        shell: bash
        run: |
          test -f localeats-api/src/lib/r52eStagingSafety.ts
          test ! -e supabase/migrations/R52E_HOSTED_PICKUP_ENABLE.sql
          test ! -e localeats-api/src/rewards/r52eLiveWallet.ts
